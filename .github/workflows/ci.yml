name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# T4.3 closes M4 by ensuring the Phase 3 hosting check (SC2) runs against a
# real `shop_backend` build in CI. The hosting-validation integration tests
# (`packages/shop_arena/tests/shop_gen/data_validation/test_hosting_check.py`)
# skip themselves when `packages/shop_backend/dist/cli.js` is missing, so we
# build the TypeScript backend first, then run pytest.
jobs:
  hosting-validation:
    name: shop_gen Phase 3 hosting validation (SC2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- TypeScript toolchain + shop_backend build ----------
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install pnpm workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shop_backend
        run: pnpm --filter @shop-gym/shop-backend build

      # ---------- Python toolchain + shop_arena tests ----------
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync uv workspace
        run: uv sync

      - name: Run Phase 3 hosting validation tests
        run: >-
          uv run pytest
          packages/shop_arena/tests/shop_gen/data_validation
          -v

      - name: Run full shop_arena test suite
        run: uv run pytest packages/shop_arena/tests

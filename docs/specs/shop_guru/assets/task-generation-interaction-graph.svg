<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title description">
  <title id="title">Example interaction graph for a SandboxShop</title>
  <desc id="description">Five nodes distinguish a product listing, an in-stock product detail, an out-of-stock product detail, a populated shopping cart, and an empty shopping cart. Edges represent opening a product, selecting a sold-out variant, adding to the shopping cart, removing the last item, and continuing shopping. Each node lists its interactive controls.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 4.5L0 9Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .page { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; fill: #334155; }
      .state { font-size: 23px; font-weight: 700; }
      .control { font-size: 17px; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .label { font-size: 16px; fill: #334155; }
      .node { stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1180" height="680" rx="16" fill="#ffffff"/>
  <text x="30" y="42" font-size="25" font-weight="700">Example interaction graph</text>
  <text x="30" y="73" font-size="17" fill="#475569">Nodes = page type + key state. Arrows = browser actions. Boxes list interactive controls.</text>

  <!-- Observed transition examples. -->
  <path class="edge" d="M305 282C365 282 365 185 425 185"/>
  <path class="edge" d="M305 350C365 350 365 475 425 475"/>
  <path class="edge" d="M725 185H855"/>
  <path class="edge" d="M575 270V390"/>
  <path class="edge" d="M1002 270V390"/>
  <path class="edge" d="M855 500C815 500 815 610 775 610H170C145 610 145 470 145 395"/>

  <!-- Transition labels have white backing for readability. -->
  <rect x="316" y="213" width="90" height="27" rx="5" fill="#ffffff"/>
  <text class="label" x="361" y="232" text-anchor="middle">Open item</text>
  <rect x="316" y="420" width="90" height="27" rx="5" fill="#ffffff"/>
  <text class="label" x="361" y="439" text-anchor="middle">Open item</text>
  <rect x="734" y="147" width="111" height="27" rx="5" fill="#ffffff"/>
  <text class="label" x="789" y="166" text-anchor="middle">Add to cart</text>
  <rect x="461" y="313" width="229" height="32" rx="5" fill="#ffffff"/>
  <text class="label" x="575" y="334" text-anchor="middle">Select sold-out variant</text>
  <rect x="907" y="313" width="190" height="32" rx="5" fill="#ffffff"/>
  <text class="label" x="1002" y="334" text-anchor="middle">Remove last item</text>
  <rect x="400" y="594" width="194" height="32" rx="5" fill="#ffffff"/>
  <text class="label" x="497" y="615" text-anchor="middle">Continue shopping</text>

  <g>
    <rect class="node" x="30" y="245" width="275" height="150" rx="12" fill="#eff6ff" stroke="#93b4e5"/>
    <text class="page" x="50" y="277">PRODUCT LISTING</text>
    <text class="state" x="50" y="312">Products visible</text>
    <text class="control" x="50" y="351">Product links</text>
    <text class="control" x="50" y="376">Search / filter controls</text>
  </g>
  <g>
    <rect class="node" x="425" y="100" width="300" height="170" rx="12" fill="#eff6ff" stroke="#93b4e5"/>
    <text class="page" x="445" y="133">PRODUCT DETAIL</text>
    <text class="state" x="445" y="169">In stock</text>
    <text class="control" x="445" y="209">Variant, quantity</text>
    <text class="control" x="445" y="237">Add to cart: enabled</text>
  </g>
  <g>
    <rect class="node" x="425" y="390" width="300" height="170" rx="12" fill="#fffbeb" stroke="#e4c568"/>
    <text class="page" x="445" y="423">PRODUCT DETAIL</text>
    <text class="state" x="445" y="459">Out of stock</text>
    <text class="control" x="445" y="499">Variant selector</text>
    <text class="control" x="445" y="527">Add to cart: disabled</text>
  </g>
  <g>
    <rect class="node" x="855" y="100" width="295" height="170" rx="12" fill="#ecfdf5" stroke="#85c9ae"/>
    <text class="page" x="875" y="133">SHOPPING CART</text>
    <text class="state" x="875" y="169">Populated</text>
    <text class="control" x="875" y="209">Quantity, remove item</text>
    <text class="control" x="875" y="237">Checkout</text>
  </g>
  <g>
    <rect class="node" x="855" y="390" width="295" height="170" rx="12" fill="#ecfdf5" stroke="#85c9ae"/>
    <text class="page" x="875" y="423">SHOPPING CART</text>
    <text class="state" x="875" y="459">Empty</text>
    <text class="control" x="875" y="499">Continue shopping</text>
  </g>
  <text x="30" y="657" font-size="16" fill="#475569">Product / variant IDs remain parameters. Each concrete task path still requires replay.</text>
</svg>

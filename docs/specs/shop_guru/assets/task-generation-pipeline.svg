<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="726" viewBox="0 0 1160 726" role="img" aria-labelledby="title description">
  <title id="title">Three task generation routes, one validation contract</title>
  <desc id="description">Authored scenarios feed template generation. Catalog and answer facts feed product-first generation. A sandbox or real shop feeds BFS and browser exploration, with backend state available only in sandboxes. All three produce a private setup, requirements, evidence, and success predicates before goal wording. Grounding, fresh replay, and verifier tests gate admission. Evaluated agents see the goal; fixtures, checks, and reference traces remain private.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #e2e8f0; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #cbd5e1; }
      .muted { fill: #94a3b8; }
      .edge { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1160" height="726" rx="16" fill="#0b1120"/>
  <rect width="1160" height="726" rx="16" fill="url(#grid)"/>
  <text x="30" y="43" font-size="27" font-weight="700">Three routes. One admission gate.</text>
  <text x="30" y="74" class="body muted">Start from the evidence that fits the shopper goal; validate every concrete task.</text>

  <!-- Connections precede opaque boxes to keep the flow unobstructed. -->
  <path class="edge" d="M200 166V208"/>
  <path class="edge" d="M580 166V208"/>
  <path class="edge" d="M960 166V208"/>
  <path class="edge" d="M200 344V380H580V414"/>
  <path class="edge" d="M580 344V414"/>
  <path class="edge" d="M960 344V380H580V414"/>
  <path class="edge" d="M580 488V510H155V550"/>
  <path class="edge" d="M280 590H330"/>
  <path class="edge" d="M790 590H836"/>

  <g>
    <rect x="30" y="106" width="340" height="60" rx="10" fill="#111d30" stroke="#334155"/>
    <text x="50" y="132" class="body">Authored shopper scenario</text>
    <text x="50" y="154" class="small">Intent, fixture rules, expected changes</text>
    <rect x="410" y="106" width="340" height="60" rx="10" fill="#111d30" stroke="#334155"/>
    <text x="430" y="132" class="body">Catalog and answer evidence</text>
    <text x="430" y="154" class="small">Products, policy clauses, order facts</text>
    <rect x="790" y="106" width="340" height="60" rx="10" fill="#111d30" stroke="#334155"/>
    <text x="810" y="132" class="body">Sandbox or real shop</text>
    <text x="810" y="154" class="small">Reset + backend state / public UI + cart</text>
  </g>

  <g>
    <rect x="30" y="208" width="340" height="136" rx="12" fill="#102936" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="50" y="241" class="heading" style="fill:#67e8f9">T · Template</text>
    <text x="50" y="273" class="body">Bind records to reviewed scenarios.</text>
    <text x="50" y="303" class="small">Policy reads · controlled operations</text>
    <text x="50" y="326" class="small">Low cost; authored coverage boundary</text>

    <rect x="410" y="208" width="340" height="136" rx="12" fill="#251d3d" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="430" y="241" class="heading" style="fill:#c4b5fd">P · Product-first</text>
    <text x="430" y="273" class="body">Derive constraints and valid choices.</text>
    <text x="430" y="303" class="small">Discovery · comparison · baskets</text>
    <text x="430" y="326" class="small">Data feasibility; UI still needs checking</text>

    <rect x="790" y="208" width="340" height="136" rx="12" fill="#30261b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="810" y="241" class="heading" style="fill:#fcd34d">B · BFS + explore</text>
    <text x="810" y="273" class="body">Test transitions; assemble workflows.</text>
    <text x="810" y="303" class="small">Cart revision · purchase workflows</text>
    <text x="810" y="326" class="small">Behavior evidence; bounded exploration</text>
  </g>

  <rect x="30" y="414" width="1100" height="74" rx="12" fill="#172033" stroke="#64748b"/>
  <text x="50" y="444" class="heading">Private task specification</text>
  <text x="50" y="473" class="body">Setup + requirements + evidence + success predicates</text>
  <text x="1110" y="444" text-anchor="end" class="small">Primary route + supporting inputs recorded</text>

  <rect x="30" y="550" width="250" height="80" rx="12" fill="#111d30" stroke="#64748b"/>
  <text x="50" y="581" class="heading">Write the goal</text>
  <text x="50" y="608" class="small">Preserve fixed requirements</text>

  <rect x="330" y="530" width="460" height="120" rx="12" fill="#102b29" stroke="#34d399" stroke-width="1.5"/>
  <text x="350" y="561" class="heading" style="fill:#6ee7b7">Shared validation</text>
  <text x="350" y="590" class="body">Visible evidence → fresh replay → verifier tests</text>
  <text x="350" y="618" class="small">Valid alternatives pass; targeted mistakes fail.</text>
  <text x="350" y="639" class="small">Reject or repair failures; retain rejection reasons.</text>

  <rect x="836" y="550" width="294" height="80" rx="12" fill="#102b29" stroke="#34d399"/>
  <text x="856" y="581" class="heading" style="fill:#6ee7b7">Accepted task</text>
  <text x="856" y="608" class="small">Goal + private validation artifacts</text>

  <text x="30" y="690" class="small">Agent input: goal + permitted observations</text>
  <text x="1130" y="690" text-anchor="end" class="small">Private: fixtures, predicates, answers, reference traces</text>
</svg>

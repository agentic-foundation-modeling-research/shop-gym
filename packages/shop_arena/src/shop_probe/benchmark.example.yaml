# ShopProbe v0.1 bench (web_probe_patch.md).
#
# Two flat populations of storefronts — sandboxes generated by ShopArena
# and real Shopify-shaped storefronts — compared group-vs-group by the
# structural-fidelity instrument.
#
# Note: real merchant URLs are not committed (per project policy). The
# `*.example.invalid` placeholders are substituted by the operator-time
# bench YAML kept under `outputs/`. Two sandbox `base_url` values are
# `TBD` — those storefronts are pending a `shop-gen` deployment and will
# be wired by the operator at deploy time.
version: "0.1"

sandboxes:
  - name: shop_alpha
    base_url: TBD
    label: sandbox
  - name: shop_beta
    base_url: TBD
    label: sandbox
    notes: Sandbox URL pending `shop-gen` deployment.
  - name: shop_gamma
    base_url: TBD
    label: sandbox
    notes: Sandbox URL pending `shop-gen` deployment.

reals:
  - name: real_a
    base_url: https://real-1.example.invalid
    label: real
    notes: Stock-leaning Online Store 2.0 / Dawn-derivative theme.
  - name: real_b
    base_url: https://real-2.example.invalid
    label: real
    notes: Shopify Plus, heavily customised theme and AJAX-rich UX.
  - name: real_c
    base_url: https://real-3.example.invalid
    label: real
    notes: Hydrogen-based with multi-market locale switching.

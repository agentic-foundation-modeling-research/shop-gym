# ShopProbe rubric v1.2 (spec docs/specs/shop_arena/web_probe_v1_2_advanced.md).
#
# 74 probes: the 66 v1.1 entries (unchanged) plus 8 new ``level: advanced``
# entries that drive interactions and assert state changes:
#
#   * collection.sort.changes_order, collection.filters.applies_to_results,
#     collection.pagination.advances, collection.filters.url_state_advances —
#     exercise the sort / filter / pagination behaviours their v1
#     presence-only counterparts only assert exist.
#   * product.variant.swap_updates_state, product.qty.spinner_increments —
#     exercise the variant + qty controls.
#   * search.predictive.populates_listbox — types into the header search and
#     asserts the predictive listbox actually populates.
#   * dynamics.cart_count_badge_updates — adds to cart and asserts the
#     header badge text changes.
#
# All 8 advanced entries are ``authenticated: false`` and
# ``transactional: false`` so they ship without --include-auth. v1.1's
# auth + checkout slice (account.* + checkout.*) is preserved verbatim.
#
# Like v1 / v1.1, this file is content-addressable: shop_probe.rubric.loader
# hashes the raw bytes and embeds the digest in every ProbeReport
# (spec §5.8). Edits bump the version string AND the hash pinned in
# tests/test_rubric_v1_2.py.

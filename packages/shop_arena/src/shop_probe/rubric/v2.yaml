# ShopProbe rubric v2 (spec §5.3.3 + Appendix 8.4–8.5).
#
# 74 entries: the 66 v1.1 entries (unchanged, including the auth +
# transactional slice) plus 8 ``level: capture_judge`` advanced entries
# that drive a single Anthropic Messages-API call per probe over the
# per-shop 5-page bundle (home / collection / product / cart / search).
#
# The v1.1 entries are still gated behind ``shop-probe run --include-auth``
# for the auth + transactional rows. The 8 new capture-judge entries run
# unconditionally (no auth requirement); each entry's inline
# ``capture_judge`` block lists the bundle pages it needs and the
# structural-affordance question handed to the judge.
#
# Like every rubric, this file is content-addressable: the loader hashes
# the raw bytes and embeds the digest in every ProbeReport (spec §5.8).
# Edits bump the version string AND the hash pinned in
# tests/shop_probe/test_rubric_v2.py.
version: v2

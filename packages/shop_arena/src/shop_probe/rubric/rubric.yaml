# ShopProbe rubric v3 (spec docs/specs/shop_arena/shop_probe.md).
#
# 75 entries: 66 deterministic ``type: probe`` rows, 8 ``type:
# capture_judge`` advanced rows (one LLM call each over the per-shop
# 5-page bundle), and 1 ``type: scale`` row that produces bundle-derived
# richness + catalog metrics. The ``type`` discriminator on every entry
# selects the runner; the eval pipeline executes everything in this
# file in a single pass.
#
# The auth + transactional rows are still gated behind
# ``shop-probe eval --include-auth``. The capture-judge entries run
# unconditionally; each entry's inline ``capture_judge`` block lists
# the bundle pages it needs and the structural-affordance question
# handed to the judge. The lone ``type: scale`` row reuses the bundle
# stats and reads catalog counts from each target's optional
# ``data_dir`` (None ⇒ catalog metrics are None).
#
# Every entry's ``description`` is a two-part block: the first line
# states the operational signal the probe / judge / scale runner looks
# for; the second line states the shopper affordance the signal stands
# in for. Reports surface these strings verbatim in the per-entry
# rollup.
#
# Like every rubric, this file is content-addressable: the loader
# hashes the raw bytes and embeds the digest in every ProbeReport
# header. Edits bump the version string AND invalidate every cached
# report at once.
version: v3
entries:
  # --- site_shell (6) -------------------------------------------------------
  - id: site_shell.header.sticky
    type: probe
    category: site_shell
    level: core
    weight: 2
    probe: probes.site_shell.header_is_sticky
    description: |
      Site header remains visible after scrolling 600px down the homepage.
      Sticky chrome lets shoppers reach the cart and primary nav from any
      scroll position without scrolling back to the top.
    authenticated: false
    transactional: false
  - id: site_shell.header.logo_links_home
    type: probe
    category: site_shell
    level: core
    weight: 1
    probe: probes.site_shell.header_logo_links_home
    description: |
      Header logo links back to the storefront root.
      The "click logo to go home" convention is a baseline navigation
      expectation across modern e-commerce.
    authenticated: false
    transactional: false
  - id: site_shell.header.cart_link
    type: probe
    category: site_shell
    level: core
    weight: 3
    probe: probes.site_shell.header_has_cart_link
    description: |
      Header exposes a cart link or icon that navigates to /cart.
      A persistent cart entry-point is required to convert browsing into
      checkout from any page.
    authenticated: false
    transactional: false
  - id: site_shell.nav.primary_collection_link
    type: probe
    category: site_shell
    level: core
    weight: 3
    probe: probes.site_shell.nav_has_primary_collection_link
    description: |
      Primary navigation surfaces at least one /collections/* link.
      Without a category entry-point in the chrome, the catalog is
      functionally inaccessible from the homepage.
    authenticated: false
    transactional: false
  - id: site_shell.footer.link_group
    type: probe
    category: site_shell
    level: core
    weight: 1
    probe: probes.site_shell.footer_has_link_group
    description: |
      Footer renders at least one labeled link group.
      Footer groups (about, support, policies) signal a complete site
      shell rather than a single-page stub.
    authenticated: false
    transactional: false
  - id: site_shell.nav.mega_menu
    type: probe
    category: site_shell
    level: modern
    weight: 2
    probe: probes.site_shell.nav_has_mega_menu
    description: |
      Primary nav exposes a grouped "mega menu" panel.
      Mega-menus expose deeper catalog structure on hover and are common
      on modern themes carrying broad product hierarchies.
    authenticated: false
    transactional: false

  # --- homepage (5) ---------------------------------------------------------
  - id: homepage.hero.present
    type: probe
    category: homepage
    level: core
    weight: 2
    probe: probes.homepage.has_hero_section
    description: |
      Homepage opens with a hero / banner section that includes a heading
      or image. The hero is the brand's first impression and orients the
      shopper to the storefront's identity above the fold.
    authenticated: false
    transactional: false
  - id: homepage.cta_to_collection
    type: probe
    category: homepage
    level: core
    weight: 2
    probe: probes.homepage.has_cta_to_collection
    description: |
      Homepage exposes a labeled call-to-action linking to a /collections/*
      destination. CTAs convert hero attention into category-level intent
      and short-circuit the chrome-nav step.
    authenticated: false
    transactional: false
  - id: homepage.feature_grid
    type: probe
    category: homepage
    level: modern
    weight: 2
    probe: probes.homepage.has_feature_grid
    description: |
      Homepage renders a feature / featured-product grid with at least
      two cards. Feature grids surface curated products without forcing
      the shopper to dive into a category.
    authenticated: false
    transactional: false
  - id: homepage.testimonials
    type: probe
    category: homepage
    level: modern
    weight: 1
    probe: probes.homepage.has_testimonial_section
    description: |
      Homepage renders a testimonials / reviews / quotes section.
      Social proof on the homepage is a fidelity marker for trust-building
      2025-era themes.
    authenticated: false
    transactional: false
  - id: homepage.multiple_section_types
    type: probe
    category: homepage
    level: modern
    weight: 2
    probe: probes.homepage.multiple_section_types
    description: |
      Homepage renders at least three distinct section types
      (hero, features, testimonials, ...). A multi-section homepage
      signals an editorial layout rather than a single-screen template.
    authenticated: false
    transactional: false

  # --- collection (8) -------------------------------------------------------
  - id: collection.listing.product_cards
    type: probe
    category: collection
    level: core
    weight: 3
    probe: probes.collection.has_product_cards
    description: |
      Collection page renders at least one product card with image,
      title, and price. The product card is the unit of catalog browsing
      — without it the page has no shoppable surface.
    authenticated: false
    transactional: false
  - id: collection.listing.product_card_links_to_pdp
    type: probe
    category: collection
    level: core
    weight: 3
    probe: probes.collection.product_card_links_to_pdp
    description: |
      Each product card on a collection page links to a /products/* URL.
      Cards must navigate to the PDP for the catalog → detail flow to
      function.
    authenticated: false
    transactional: false
  - id: collection.listing.has_filters
    type: probe
    category: collection
    level: core
    weight: 2
    probe: probes.collection.has_filters
    description: |
      Collection page exposes at least one filter control.
      Filters narrow large catalogs to the shopper's intent and are a
      baseline of any non-trivial collection page.
    authenticated: false
    transactional: false
  - id: collection.listing.has_sort
    type: probe
    category: collection
    level: core
    weight: 2
    probe: probes.collection.has_sort_control
    description: |
      Collection page exposes a sort control.
      Sort lets shoppers choose between popularity, price, and newness
      orderings without leaving the listing.
    authenticated: false
    transactional: false
  - id: collection.pagination.present
    type: probe
    category: collection
    level: core
    weight: 1
    probe: probes.collection.has_pagination_or_infinite_scroll
    description: |
      Collection page exposes pagination, infinite scroll, or load-more
      when results exceed the first page. Pagination is required to reach
      products beyond the initial render.
    authenticated: false
    transactional: false
  - id: collection.filters.sidebar_layout
    type: probe
    category: collection
    level: core
    weight: 2
    probe: probes.collection.has_sidebar_filter_layout
    description: |
      Collection page renders filters inside a sidebar / aside layout.
      Sidebar layouts are the modern desktop convention; mobile drawers
      are an acceptable hidden form of the same affordance.
    authenticated: false
    transactional: false
  - id: collection.filters.url_state_sync
    type: probe
    category: collection
    level: modern
    weight: 2
    probe: probes.collection.filters_sync_to_url_state
    description: |
      Collection filters expose URL-state-sync (anchor-based or GET-form).
      URL-encoded filter state lets shoppers share or bookmark a filtered
      view and is a maturity signal on the listing UI.
    authenticated: false
    transactional: false
  - id: collection.filters.active_chips
    type: probe
    category: collection
    level: modern
    weight: 1
    probe: probes.collection.has_active_filter_chips
    description: |
      Collection page exposes a container for active-filter chips.
      Chips communicate which filters are applied and offer a single-click
      removal path back to a broader result set.
    authenticated: false
    transactional: false

  # --- product (10) ---------------------------------------------------------
  - id: product.gallery.image
    type: probe
    category: product
    level: core
    weight: 3
    probe: probes.product.gallery_has_image
    description: |
      Product detail page renders at least one product image.
      Without a product image the PDP cannot communicate the product
      visually and conversion drops sharply.
    authenticated: false
    transactional: false
  - id: product.title.present
    type: probe
    category: product
    level: core
    weight: 3
    probe: probes.product.has_title
    description: |
      Product detail page renders the product title.
      The title is the primary semantic anchor of the PDP for both
      shoppers and search engines.
    authenticated: false
    transactional: false
  - id: product.price.present
    type: probe
    category: product
    level: core
    weight: 3
    probe: probes.product.has_price
    description: |
      Product detail page renders the product price.
      Price is the conversion signal — its absence on the PDP is a
      hard regression.
    authenticated: false
    transactional: false
  - id: product.add_to_cart.button
    type: probe
    category: product
    level: core
    weight: 3
    probe: probes.product.has_add_to_cart_button
    description: |
      Product detail page exposes an enabled add-to-cart button.
      The add-to-cart action is the PDP's primary call-to-action and
      the entry-point to every checkout path.
    authenticated: false
    transactional: false
  - id: product.description.present
    type: probe
    category: product
    level: core
    weight: 1
    probe: probes.product.has_description
    description: |
      Product detail page renders a product description block.
      Descriptions carry the fit / materials / features the shopper needs
      to decide before committing.
    authenticated: false
    transactional: false
  - id: product.gallery.thumbnails
    type: probe
    category: product
    level: modern
    weight: 2
    probe: probes.product.gallery_has_thumbnails
    description: |
      PDP gallery exposes a thumbnail strip with at least two thumbnails.
      Thumbnails let the shopper compare angles or variants without
      disturbing the gallery focus.
    authenticated: false
    transactional: false
  - id: product.variant.selector
    type: probe
    category: product
    level: core
    weight: 2
    probe: probes.product.has_variant_selector
    description: |
      PDP exposes a variant selector (radio swatches, select, or dropdown).
      Variants are required whenever the product comes in multiple sizes,
      colours, or other configurable options.
    authenticated: false
    transactional: false
  - id: product.qty.spinner
    type: probe
    category: product
    level: core
    weight: 2
    probe: probes.product.has_quantity_spinner
    description: |
      PDP exposes a numeric quantity spinner.
      Quantity selection is required to support multi-unit purchases
      without re-adding the same product to cart.
    authenticated: false
    transactional: false
  - id: product.breadcrumbs
    type: probe
    category: product
    level: modern
    weight: 1
    probe: probes.product.has_breadcrumbs
    description: |
      PDP renders a breadcrumb trail.
      Breadcrumbs orient the shopper within the catalog hierarchy and
      let them step back to a parent collection.
    authenticated: false
    transactional: false
  - id: product.recommendations
    type: probe
    category: product
    level: modern
    weight: 1
    probe: probes.product.has_recommendations
    description: |
      PDP renders a "you may also like" / recommendations section.
      Cross-sell modules increase discoverability without forcing the
      shopper to back out to a collection.
    authenticated: false
    transactional: false

  # --- search (5) -----------------------------------------------------------
  - id: search.header.trigger
    type: probe
    category: search
    level: core
    weight: 3
    probe: probes.search.header_has_search_trigger
    description: |
      Header exposes a search input or trigger button.
      Search is the third primary entry-point alongside nav and homepage,
      especially for shoppers who arrive with a specific intent.
    authenticated: false
    transactional: false
  - id: search.results_page.renders
    type: probe
    category: search
    level: core
    weight: 3
    probe: probes.search.results_page_renders
    description: |
      /search?q=... renders a 2xx HTML page with body content.
      The search route must respond with a usable page rather than a 4xx
      or blank for any submitted query.
    authenticated: false
    transactional: false
  - id: search.query_echo
    type: probe
    category: search
    level: core
    weight: 2
    probe: probes.search.results_page_echoes_query
    description: |
      Search results page surfaces the submitted query string in body copy.
      Echoing the query confirms to the shopper which terms were searched
      and frames the relevance of the results.
    authenticated: false
    transactional: false
  - id: search.no_results_state
    type: probe
    category: search
    level: modern
    weight: 1
    probe: probes.search.no_results_state
    description: |
      Search results page renders an explicit empty-state on unmatched
      queries. A well-handled empty-state guides shoppers to a recovery
      path instead of dead-ending on a blank list.
    authenticated: false
    transactional: false
  - id: search.predictive_listbox
    type: probe
    category: search
    level: modern
    weight: 2
    probe: probes.search.predictive_listbox_present
    description: |
      Header search exposes an ARIA combobox + listbox predictive-search UI.
      Predictive results let shoppers commit to a query without leaving
      the page they're currently browsing.
    authenticated: false
    transactional: false

  # --- cart (6) -------------------------------------------------------------
  - id: cart.page.renders
    type: probe
    category: cart
    level: core
    weight: 3
    probe: probes.cart.page_renders
    description: |
      The /cart route renders without an HTTP error.
      The cart is required for the checkout flow — a broken /cart blocks
      every purchase path.
    authenticated: false
    transactional: false
  - id: cart.line_item.shows_after_add
    type: probe
    category: cart
    level: core
    weight: 3
    probe: probes.cart.shows_added_line_item
    description: |
      After clicking add-to-cart on a PDP, the cart shows the added
      line item. Validates the PDP → cart write path end-to-end and
      confirms cart state is persisted across navigation.
    authenticated: false
    transactional: false
  - id: cart.line_item.qty_editor
    type: probe
    category: cart
    level: core
    weight: 2
    probe: probes.cart.line_item_has_qty_editor
    description: |
      Cart line items expose a quantity editor.
      Quantity edits in the cart let shoppers revise their basket without
      bouncing back to the PDP.
    authenticated: false
    transactional: false
  - id: cart.line_item.remove
    type: probe
    category: cart
    level: core
    weight: 2
    probe: probes.cart.line_item_has_remove
    description: |
      Cart line items expose a remove control.
      Remove is required for shoppers to refine their basket before
      committing to checkout.
    authenticated: false
    transactional: false
  - id: cart.empty_state.present
    type: probe
    category: cart
    level: core
    weight: 1
    probe: probes.cart.empty_state_renders
    description: |
      An empty cart renders an empty-state message rather than a blank
      page. Empty-states maintain orientation and offer a path back to
      browsing.
    authenticated: false
    transactional: false
  - id: cart.promo_code
    type: probe
    category: cart
    level: modern
    weight: 1
    probe: probes.cart.promo_code_input
    description: |
      Cart page exposes a promo / discount code input.
      Promo entry on the cart is a conversion lever many storefronts use
      before the checkout step.
    authenticated: false
    transactional: false

  # --- i18n (3) -------------------------------------------------------------
  - id: i18n.locale_switcher
    type: probe
    category: i18n
    level: modern
    weight: 2
    probe: probes.i18n.has_locale_switcher
    description: |
      Storefront exposes a language / locale switcher.
      Locale selection signals support for multilingual shoppers and is
      a fidelity marker for international stores.
    authenticated: false
    transactional: false
  - id: i18n.currency_switcher
    type: probe
    category: i18n
    level: modern
    weight: 2
    probe: probes.i18n.has_currency_switcher
    description: |
      Storefront exposes a currency switcher.
      Currency selection is required for cross-border shoppers to
      evaluate price in their familiar denomination.
    authenticated: false
    transactional: false
  - id: i18n.country_list
    type: probe
    category: i18n
    level: modern
    weight: 1
    probe: probes.i18n.has_country_list
    description: |
      Storefront exposes a country / market selector.
      Country selection routes shoppers to the correct fulfilment market
      and pricing.
    authenticated: false
    transactional: false

  # --- floating (3) ---------------------------------------------------------
  - id: floating.cookie_consent
    type: probe
    category: floating
    level: modern
    weight: 2
    probe: probes.floating.has_cookie_consent
    description: |
      Storefront renders a cookie / privacy consent affordance.
      Consent banners are a regulatory signal and a near-universal
      feature on EU-targeting storefronts.
    authenticated: false
    transactional: false
  - id: floating.newsletter_popup
    type: probe
    category: floating
    level: modern
    weight: 1
    probe: probes.floating.has_newsletter_popup
    description: |
      Storefront renders a newsletter signup popup or dialog.
      Newsletter capture is a common growth surface on modern e-commerce
      themes.
    authenticated: false
    transactional: false
  - id: floating.chat_widget
    type: probe
    category: floating
    level: modern
    weight: 1
    probe: probes.floating.has_chat_widget
    description: |
      Storefront renders a chat-widget launcher.
      Live chat is a fidelity marker for storefronts that support
      real-time customer service.
    authenticated: false
    transactional: false

  # --- dynamics (5) ---------------------------------------------------------
  - id: dynamics.toast_region
    type: probe
    category: dynamics
    level: modern
    weight: 1
    probe: probes.dynamics.has_toast_region
    description: |
      Page exposes a live region for toast / snackbar messages.
      Toast regions communicate transient state changes (added to cart,
      applied filter) without modal disruption.
    authenticated: false
    transactional: false
  - id: dynamics.url_state_sync
    type: probe
    category: dynamics
    level: modern
    weight: 2
    probe: probes.dynamics.url_state_sync_present
    description: |
      Collection filters carry their state in the URL via anchors or a
      GET form. URL-encoded state lets shoppers share or refresh into the
      same filtered view.
    authenticated: false
    transactional: false
  - id: dynamics.debounced_input
    type: probe
    category: dynamics
    level: modern
    weight: 1
    probe: probes.dynamics.debounced_input_present
    description: |
      A search-shaped input declares an explicit data-debounce attribute.
      Debounced inputs throttle network traffic while the shopper is
      still typing — a maturity signal on predictive search.
    authenticated: false
    transactional: false
  - id: dynamics.ajax_cart_endpoint
    type: probe
    category: dynamics
    level: core
    weight: 2
    probe: probes.dynamics.ajax_cart_endpoint_discoverable
    description: |
      /cart.js (or equivalent) returns a JSON cart payload.
      A JSON cart endpoint enables modern AJAX cart updates without
      full-page reloads.
    authenticated: false
    transactional: false
  - id: dynamics.cart_count_badge
    type: probe
    category: dynamics
    level: modern
    weight: 1
    probe: probes.dynamics.cart_count_badge_present
    description: |
      Header carries an updatable cart-count badge.
      The badge gives shoppers persistent feedback on basket size as
      they continue browsing.
    authenticated: false
    transactional: false

  # --- a11y (6) -------------------------------------------------------------
  - id: a11y.skip_to_content
    type: probe
    category: a11y
    level: core
    weight: 2
    probe: probes.a11y.skip_to_content_link
    description: |
      A "skip to main content" link is present near the top of the
      document. The skip link is the canonical keyboard-navigation
      accommodation for screen-reader users.
    authenticated: false
    transactional: false
  - id: a11y.combobox_role
    type: probe
    category: a11y
    level: modern
    weight: 1
    probe: probes.a11y.combobox_role_present
    description: |
      At least one element exposes role="combobox".
      Comboboxes (typically the search input) need the role to expose
      typeahead results to assistive tech.
    authenticated: false
    transactional: false
  - id: a11y.dialog_role
    type: probe
    category: a11y
    level: modern
    weight: 1
    probe: probes.a11y.dialog_role_present
    description: |
      At least one role="dialog" or <dialog> element exists on the page.
      Modal surfaces (newsletter, login, mini-cart) need dialog semantics
      for proper focus management.
    authenticated: false
    transactional: false
  - id: a11y.live_region
    type: probe
    category: a11y
    level: modern
    weight: 1
    probe: probes.a11y.live_region_present
    description: |
      At least one aria-live region exists on the page.
      Live regions are how dynamic state changes (cart updates, errors)
      reach screen-reader users without disrupting focus.
    authenticated: false
    transactional: false
  - id: a11y.alt_text_coverage
    type: probe
    category: a11y
    level: core
    weight: 2
    probe: probes.a11y.alt_text_coverage
    description: |
      At least 80% of <img> elements declare an alt attribute.
      Alt-text coverage is the basic image accessibility floor and a
      WCAG 1.1.1 requirement.
    authenticated: false
    transactional: false
  - id: a11y.focus_visible
    type: probe
    category: a11y
    level: modern
    weight: 1
    probe: probes.a11y.focus_visible_style
    description: |
      The page's stylesheet defines a :focus-visible rule.
      Visible focus styling is required for keyboard navigators to know
      where the focus currently sits.
    authenticated: false
    transactional: false

  # --- media (4) ------------------------------------------------------------
  - id: media.lazy_load_images
    type: probe
    category: media
    level: modern
    weight: 2
    probe: probes.media.lazy_loaded_images
    description: |
      At least one image declares loading="lazy".
      Native lazy loading defers off-screen image fetches and is a
      baseline performance signal on modern themes.
    authenticated: false
    transactional: false
  - id: media.responsive_srcset
    type: probe
    category: media
    level: modern
    weight: 2
    probe: probes.media.responsive_srcset
    description: |
      At least one image declares a srcset attribute.
      Srcset lets the browser pick the right image for the viewport —
      a baseline responsive-image practice.
    authenticated: false
    transactional: false
  - id: media.lightbox_or_zoom
    type: probe
    category: media
    level: modern
    weight: 1
    probe: probes.media.lightbox_or_zoom
    description: |
      PDP exposes a lightbox / zoom affordance for the gallery.
      Image zoom helps shoppers inspect product detail (texture,
      stitching, finish) before committing to a purchase.
    authenticated: false
    transactional: false
  - id: media.swatch_image_swap
    type: probe
    category: media
    level: modern
    weight: 1
    probe: probes.media.swatch_image_swap
    description: |
      Variant swatches carry a data-* image hint that supports swapping
      the main gallery image. Image swap on swatch select communicates
      variant differences visually rather than only by label.
    authenticated: false
    transactional: false
  # --- account (3, v1.1, authenticated) ------------------------------------
  - id: account.login.form_present
    type: probe
    category: account
    level: core
    weight: 2
    probe: probes.account.login_form_present
    description: |
      /account/login exposes an email + password form.
      The login form is the gate to authenticated experiences (saved
      addresses, order history, wishlists).
    authenticated: true
    transactional: false
  - id: account.signup.form_present
    type: probe
    category: account
    level: core
    weight: 1
    probe: probes.account.signup_form_present
    description: |
      /account/register exposes a signup form with email + password
      inputs. Sign-up is required to onboard new shoppers into the
      account experience.
    authenticated: true
    transactional: false
  - id: account.page.renders
    type: probe
    category: account
    level: core
    weight: 2
    probe: probes.account.page_renders
    description: |
      /account renders an authenticated dashboard or redirects to
      /account/login. The /account root must either serve the dashboard
      or redirect — both are valid behaviours.
    authenticated: true
    transactional: false
  # --- checkout (2, v1.1, transactional) -----------------------------------
  - id: checkout.flow.initiates
    type: probe
    category: checkout
    level: core
    weight: 3
    probe: probes.checkout.flow_initiates
    description: |
      Cart's checkout CTA navigates to a checkout surface (same-origin
      /checkout or a checkout subdomain). Validates the cart → checkout
      handoff that gates every purchase.
    authenticated: false
    transactional: true
  - id: checkout.page.renders
    type: probe
    category: checkout
    level: core
    weight: 2
    probe: probes.checkout.page_renders
    description: |
      /checkout renders a checkout page with at least an email / contact
      field. The checkout page must collect contact info to complete a
      purchase.
    authenticated: false
    transactional: true

  # --- v2 capture-judge advanced tier (8 entries, total weight 14) -----------
  # Each entry references a slice of the per-shop 5-page bundle (home /
  # collection / product / cart / search) and asks one structural-affordance
  # question. The dispatcher rolls these into ``coverage_advanced``.
  - id: collection.sort.changes_order
    type: capture_judge
    category: collection
    level: advanced
    weight: 2
    description: |
      Capture-judge — collection page exposes a sort control with multiple
      options. Multiple sort options signal a usable sort affordance
      versus a stub control.
    authenticated: false
    transactional: false
    capture_judge:
      pages: [collection]
      judge_prompt: |
        Does the collection page expose a sort control (dropdown, segmented
        buttons, or similar) with two or more selectable sort options?
        Inspect the screenshot and the accessibility tree before answering.

  - id: collection.filters.applies_to_results
    type: capture_judge
    category: collection
    level: advanced
    weight: 2
    description: |
      Capture-judge — collection page exposes filter controls bound to
      the result list. Validates that the filter UI is wired to product
      narrowing rather than purely decorative.
    authenticated: false
    transactional: false
    capture_judge:
      pages: [collection]
      judge_prompt: |
        Does the collection page expose at least one filter control
        (checkbox, segmented buttons, faceted sidebar, etc.) that, by its
        placement and labelling, narrows the visible product list?

  - id: collection.pagination.advances
    type: capture_judge
    category: collection
    level: advanced
    weight: 1
    description: |
      Capture-judge — collection page exposes a pagination affordance.
      Accepts numbered pages, next/prev buttons, load-more, or scroll
      pagination as evidence.
    authenticated: false
    transactional: false
    capture_judge:
      pages: [collection]
      judge_prompt: |
        Does the collection page expose a pagination affordance — next-page
        button, numbered page links, "load more" button, or visible
        scroll-pagination indicator?

  - id: collection.filters.url_state_advances
    type: capture_judge
    category: collection
    level: advanced
    weight: 2
    description: |
      Capture-judge — collection page filter controls suggest URL-encoded
      state. Anchor-based facets and "share filtered view" affordances
      are positive signals beyond what static markup alone reveals.
    authenticated: false
    transactional: false
    capture_judge:
      pages: [collection]
      judge_prompt: |
        Do the filter controls on the collection page appear to encode their
        state in the URL? Look for filter facets that are anchor / link
        elements (vs. plain JS-only checkboxes), explicit "share filtered
        view" affordances, or visible hints that the URL changes on filter
        apply.

  - id: product.variant.swap_updates_state
    type: capture_judge
    category: product
    level: advanced
    weight: 2
    description: |
      Capture-judge — product page exposes variant selectors.
      Validates that swatches, dropdowns, or radio groups offer two or
      more selectable options to the shopper.
    authenticated: false
    transactional: false
    capture_judge:
      pages: [product]
      judge_prompt: |
        Does the product page expose a variant-selection control (color
        swatches, size dropdown, segmented buttons, radio group) with two
        or more selectable options?

  - id: product.qty.spinner_increments
    type: capture_judge
    category: product
    level: advanced
    weight: 1
    description: |
      Capture-judge — product page exposes a quantity input with an
      increment control. Accepts +/− spinners, number inputs, or
      labelled steppers as evidence.
    authenticated: false
    transactional: false
    capture_judge:
      pages: [product]
      judge_prompt: |
        Does the product page expose a quantity input — a spinner with
        +/− buttons, a number input, or labelled stepper — that the
        shopper could use to increase the purchase quantity?

  - id: search.predictive.populates_listbox
    type: capture_judge
    category: search
    level: advanced
    weight: 2
    description: |
      Capture-judge — site header exposes a search input that signals
      predictive results. The judge looks for combobox / aria-autocomplete
      / aria-controls hints alongside the visual cue.
    authenticated: false
    transactional: false
    capture_judge:
      pages: [home]
      judge_prompt: |
        Does the homepage header expose a search input (or a button that
        opens one) configured for predictive results — e.g. role=combobox
        / aria-autocomplete / aria-controls referencing a results listbox?
        Inspect the accessibility tree alongside the screenshot.

  - id: dynamics.cart_count_badge_updates
    type: capture_judge
    category: dynamics
    level: advanced
    weight: 2
    description: |
      Capture-judge — site header exposes a cart count badge.
      The judge accepts numeric badges visible at zero or hidden until
      non-zero — both communicate basket size to the shopper.
    authenticated: false
    transactional: false
    capture_judge:
      pages: [home, product]
      judge_prompt: |
        Do the home and product page headers expose a cart icon with a
        count badge or numeric indicator that would update when an item is
        added to the cart? The badge can be visible at zero (e.g. "0") or
        hidden until non-zero.

  # --- scale (1) -------------------------------------------------------------
  # Bundle-derived scale / richness summary (per-page DOM size,
  # interactables / form-fields / accessibility-node counts) plus
  # catalog counts read from each target's optional ``data_dir``. Does
  # not contribute to coverage rollups.
  - id: site.scale
    type: scale
    description: |
      Per-page richness (DOM size, interactables, form fields,
      accessibility nodes) measured on the 5-page bundle, plus catalog
      counts (products, collections) from each target's data_dir.
      Descriptive only — surfaces in the per-shop table as scale context
      and does not feed any coverage rollup.

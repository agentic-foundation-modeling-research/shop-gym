# ShopProbe v0.1 cohort (spec §8.2).
#
# Three (source, sandbox) pairs plus three unpaired real shops, which
# together form the 6-real-shop reference population (spec §5.2).
#
# Every Target row is fully explicit (label / base_url / kind / pair_id)
# so this file validates directly via `shop_probe.targets.Cohort`.
#
# T5.1 closes spec §8.5 open questions for v0.1. Decisions are summarised
# inline below; full rationale + the anonymization-sufficiency ablation
# live in `docs/specs/shop_arena/web_probe.md` §8.6.
#
# Note: real merchant URLs are not committed (per project policy). The
# `source-*.example.invalid` / `real-*.example.invalid` placeholders are
# substituted by the operator-time cohort YAML kept under `outputs/`.
# Two `sandbox.base_url` values are still `TBD` — those storefronts are
# pending a `shop-gen` deployment (spec §8.5 Q3) and will be wired by
# T5.2; the deployment plan and fallback are documented in the v0.1
# README.
version: "0.1"

pairs:
  - id: pair_1
    source:
      label: source/1
      base_url: https://source-1.example.invalid
      kind: source
      pair_id: pair_1
    sandbox:
      label: sandbox/1
      base_url: https://shop-arena-51aad95a-126018801413.us-central1.run.app
      kind: sandbox
      pair_id: pair_1

  - id: pair_2
    source:
      label: source/2
      base_url: https://source-2.example.invalid
      kind: source
      pair_id: pair_2
      notes: >-
        Bot-detection mitigation: option (b) — residential proxy +
        slowed probes (≥1 s between requests) + cached HAR. Fallback to
        option (c) (alternate merchant) if probe failure rate exceeds
        5% on the M5 dry-run. See `docs/specs/shop_arena/web_probe.md` §8.6.2.
    sandbox:
      label: sandbox/2
      base_url: TBD
      kind: sandbox
      pair_id: pair_2
      notes: >-
        Sandbox URL pending `shop-gen` deployment (spec §8.5 Q3).
        Deploy plan: same Cloud Run service prefix as the pair_1
        sandbox (`shop-arena-<hash>-…us-central1.run.app`). T5.2 wires
        the URL once deployed. See `docs/specs/shop_arena/web_probe.md` §8.6.3.

  - id: pair_3
    source:
      label: source/3
      base_url: https://source-3.example.invalid
      kind: source
      pair_id: pair_3
      notes: >-
        Bot-detection mitigation: option (b) — residential proxy +
        slowed probes (≥1 s between requests) + cached HAR. Fallback to
        option (c) (alternate merchant) if probe failure rate exceeds
        5% on the M5 dry-run. See `docs/specs/shop_arena/web_probe.md` §8.6.2.
    sandbox:
      label: sandbox/3
      base_url: TBD
      kind: sandbox
      pair_id: pair_3
      notes: >-
        Sandbox URL pending `shop-gen` deployment (spec §8.5 Q3).
        Deploy plan: same Cloud Run service prefix as the pair_1
        sandbox (`shop-arena-<hash>-…us-central1.run.app`). T5.2 wires
        the URL once deployed. See `docs/specs/shop_arena/web_probe.md` §8.6.3.

# Three unpaired real Shopify-powered storefronts (spec §5.2). Selected
# per spec §8.5 Q1 to span the theme/catalog/i18n axes. Final
# bot-friendliness + Shopify attribution checks run as part of T5.2's M5
# dry-run; alternates listed in `docs/specs/shop_arena/web_probe.md` §8.6.1.
real_unpaired:
  - label: real/1
    base_url: https://real-1.example.invalid
    kind: real_unpaired
    notes: >-
      Stock-leaning Online Store 2.0 / Dawn-derivative theme; smaller
      catalog. Covers the "close-to-default Shopify shop" slot of the
      §5.2 real-shop population. See `docs/specs/shop_arena/web_probe.md` §8.6.1.
  - label: real/2
    base_url: https://real-2.example.invalid
    kind: real_unpaired
    notes: >-
      Shopify Plus, heavily customised theme and AJAX-rich UX. Covers
      the "heavy customisation" slot of the §5.2 real-shop population.
      See `docs/specs/shop_arena/web_probe.md` §8.6.1.
  - label: real/3
    base_url: https://real-3.example.invalid
    kind: real_unpaired
    notes: >-
      Hydrogen-based with multi-market locale switching. Covers the
      "multi-market i18n" slot of the §5.2 real-shop population. See
      `docs/specs/shop_arena/web_probe.md` §8.6.1.

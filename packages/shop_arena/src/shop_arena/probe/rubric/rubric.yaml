# ShopProbe v1.0 — minimal rubric (one slot per page type per family).
#
# Three families: observation / action / transition. Five canonical page
# types: homepage, collection, product, search, cart. Two modalities for
# observation/action: a11y, screenshot. Transitions are modality-agnostic.
#
# Spec: docs/specs/shop_arena/shop_probe.md (§5).
version: "1.0"

entries:

  # ─── observation.shape ─ mechanical, both modalities, every page ──
  - id: observation.shape
    family: observation
    kind: shape
    page_types: [homepage, collection, product, search, cart]
    modalities: [a11y, screenshot]
    description: |
      Continuous shape metrics over the agent's observation
      (a11y: nodes/tokens/actionables; screenshot: megapixels/byte_size_kb).

  # ─── observation.info_slots ─ judge, one slot per page type ───────
  - id: observation.homepage.brand_identity
    family: observation
    kind: info_slot
    page_type: homepage
    modalities: [a11y, screenshot]
    prompt: prompts/info_slots/homepage_brand_identity.md
    description: Homepage exposes a clearly-identifiable brand identity.

  - id: observation.collection.product_list
    family: observation
    kind: info_slot
    page_type: collection
    modalities: [a11y, screenshot]
    prompt: prompts/info_slots/collection_product_list.md
    description: Collection page exposes a list of products.

  - id: observation.product.title
    family: observation
    kind: info_slot
    page_type: product
    modalities: [a11y, screenshot]
    prompt: prompts/info_slots/product_title.md
    description: PDP exposes a clearly-identifiable product title.

  - id: observation.search.results_list
    family: observation
    kind: info_slot
    page_type: search
    modalities: [a11y, screenshot]
    prompt: prompts/info_slots/search_results_list.md
    description: Search page shows a results list or a no-results state.

  - id: observation.cart.line_items
    family: observation
    kind: info_slot
    page_type: cart
    modalities: [a11y, screenshot]
    prompt: prompts/info_slots/cart_line_items.md
    description: Cart page shows line items (or empty-state).

  # ─── action.space ─ mechanical, a11y only for v1 minimal ─────────
  - id: action.space
    family: action
    kind: space
    page_types: [homepage, collection, product, search, cart]
    modalities: [a11y]
    description: |
      Action-space mechanical metrics on the a11y modality
      (actionable_count, unique_role_name_rate).

  # ─── action.control_slots ─ judge, one control per page type ──────
  - id: action.homepage.nav_collection
    family: action
    kind: control_slot
    page_type: homepage
    modalities: [a11y, screenshot]
    prompt: prompts/control_slots/homepage_nav_collection.md
    description: Homepage exposes navigation to a collection.

  - id: action.collection.click_product
    family: action
    kind: control_slot
    page_type: collection
    modalities: [a11y, screenshot]
    prompt: prompts/control_slots/collection_click_product.md
    description: Collection page exposes clickable product cards.

  - id: action.product.add_to_cart
    family: action
    kind: control_slot
    page_type: product
    modalities: [a11y, screenshot]
    prompt: prompts/control_slots/product_add_to_cart.md
    description: PDP exposes an "add to cart" control.

  - id: action.cart.checkout
    family: action
    kind: control_slot
    page_type: cart
    modalities: [a11y, screenshot]
    prompt: prompts/control_slots/cart_checkout.md
    description: Cart exposes a "checkout" control.

  - id: action.search.submit_query
    family: action
    kind: control_slot
    page_type: search
    modalities: [a11y, screenshot]
    prompt: prompts/control_slots/search_submit_query.md
    description: Search exposes a query-input control.

  # ─── transition ─ scripted Playwright, modality-agnostic ─────────
  - id: transition.homepage.nav_collection
    family: transition
    kind: scripted
    page_type: homepage
    script: homepage_nav_collection
    expected_change: url_changes_to_collection
    description: Clicking a homepage nav link lands on a collection page.

  - id: transition.collection.click_product
    family: transition
    kind: scripted
    page_type: collection
    script: collection_click_product
    expected_change: url_changes_to_product
    description: Clicking a product card on a collection page lands on a PDP.

  - id: transition.product.add_to_cart
    family: transition
    kind: scripted
    page_type: product
    script: product_add_to_cart
    expected_change: cart_count_or_drawer_changes
    description: Clicking add-to-cart on a PDP changes cart state.

  - id: transition.cart.checkout
    family: transition
    kind: scripted
    page_type: cart
    script: cart_checkout
    expected_change: url_changes_to_checkout
    description: Clicking checkout from the cart navigates to a checkout URL.

  - id: transition.search.submit_query
    family: transition
    kind: scripted
    page_type: search
    script: search_submit_query
    expected_change: url_changes_to_search_results
    description: Submitting a search query lands on a search-results URL.

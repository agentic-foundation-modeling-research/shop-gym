[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shop-arena"
version = "0.1.0"
description = "ShopArena: Environment Factory that generates deterministic sandbox SandboxShops from live storefronts."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ShopGym" }]
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "playwright>=1.44",
  "harness",
  "anthropic>=0.39",
  "openai>=1.55",
  "python-dotenv>=1.0",
]

[project.scripts]
shop-gen = "shop_arena.gen.cli:main"
shop-explore = "shop_arena.explore.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shop_arena"]

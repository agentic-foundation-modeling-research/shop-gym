# Featured-shops benchmark: one entry per shop.
#
# shop_url:  storefront URL — real merchant or SandboxShop deployment.
#            Trailing slash is stripped at load time. Include any required
#            auth token in the query string; SandboxShops set a session
#            cookie on first visit so subsequent navigation works without
#            the token.
# data_dir:  path (relative to repo root) to extracted shop-arena data
# image_tag: Artifact Registry tag in us-central1-docker.pkg.dev/
#            s5y-sidekick-52ee/docker-images/shop-arena:<tag>

shops:
  - slug: mock_clothing
    name: Mock Clothing
    shop_url: https://shop-arena-96c172e4-kqqx5567kq-uc.a.run.app
    data_dir: outputs/shops/mock_clothing
    country: US
    currency: USD
    language: en
    image_tag: mock-clothing

  - slug: mock_cookware
    name: Mock Cookware
    shop_url: https://shop-arena-7e92090d-kqqx5567kq-uc.a.run.app
    data_dir: outputs/shops/mock_cookware
    country: US
    currency: USD
    language: en
    image_tag: mock-cookware

  - slug: mock_hardware
    name: Mock Hardware
    shop_url: https://shop-arena-53473e65-kqqx5567kq-uc.a.run.app
    data_dir: outputs/shops/mock_hardware
    country: US
    currency: USD
    language: en
    image_tag: mock-hardware

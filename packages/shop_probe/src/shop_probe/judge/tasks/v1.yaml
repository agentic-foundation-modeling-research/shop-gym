# Axis C — judge-diagnostic task list v1.
#
# Spec: docs/specs/shop_arena/web_probe.md §5.5 step 1 + §5.5.1.
# Each task is tuned for *judge diagnosticity*, not behavioural fidelity:
# visually rich, multi-page, interaction-heavy, and independent from
# the 108-task ShopGuru benchmark.
#
# Edits to this file MUST bump `version` AND update the pinned hash in
# packages/shop_probe/tests/judge/test_judge_tasks_v1.py — that is the
# whole point of pinning per spec §5.8.

version: v1

tasks:
  - id: filter_pdp_variant_cart_locale
    description: |
      Open the bestsellers collection, apply the Product Type filter to
      narrow results, open the third product card, switch to a
      different variant on the PDP, add 2 of that variant to the cart,
      then switch the storefront locale and confirm the cart total
      re-renders in the new locale.
    surfaces: [collection, product, cart]
    interactions:
      [filter, open_pdp, variant_select, update_quantity, add_to_cart, locale_switch]
    rationale: |
      Exercises filter UI, PDP gallery + variant picker, cart drawer
      mutation, and locale-switching reflow — four visually distinct
      surfaces in one trace.

  - id: search_to_pdp_variant_cart
    description: |
      Use the storefront search to look up "shirt", open the second
      result, choose a non-default size, add to cart, then open the
      cart drawer and increment the line-item quantity to 3.
    surfaces: [search, product, cart]
    interactions: [search_query, open_pdp, variant_select, add_to_cart, open_cart_drawer, update_quantity]
    rationale: |
      Search results UI, PDP variant control, and cart-drawer
      quantity stepper render independently per theme — strong
      diagnostic signal for theme fidelity.

  - id: collection_sort_filter_paginate
    description: |
      Open the all-products collection, sort by Price low-to-high,
      apply a Color filter, paginate to the second page of results,
      then open the first product card on that page.
    surfaces: [collection, product]
    interactions: [sort, filter, paginate, open_pdp]
    rationale: |
      Sort + filter + pagination compose a state-space (spec §5.4) that
      surfaces sandbox vs. source differences in URL, facet UI, and
      empty-state handling.

  - id: homepage_navigation_to_collection
    description: |
      From the homepage, use the primary navigation to reach a
      sub-collection two levels deep via the megamenu, then open a
      featured product from the collection grid.
    surfaces: [homepage, navigation, collection, product]
    interactions: [megamenu_navigate, open_pdp]
    rationale: |
      Megamenu rendering, hover/tap affordances, and homepage hero +
      featured-collection layout are theme-distinguishing surfaces a
      judge can read without brand strings.

  - id: pdp_gallery_review_filter
    description: |
      Open any product PDP, click through every gallery thumbnail in
      order, scroll to the reviews section, and apply a star-rating
      filter on the reviews list.
    surfaces: [product, navigation]
    interactions: [open_pdp, gallery_navigate, scroll, review_filter]
    rationale: |
      Gallery swap behaviour and review-widget UI are heavily
      theme-customised — diagnostic for both visual fidelity and
      third-party widget integration.

  - id: currency_switch_pdp
    description: |
      Switch the storefront to a non-default currency, open a featured
      product, and confirm that price, compare-at price, and any badge
      labels render in the new currency.
    surfaces: [homepage, product]
    interactions: [currency_switch, open_pdp]
    rationale: |
      Multi-currency / multi-market markup, badge re-rendering, and
      Shopify Markets switcher placement diverge between sandbox and
      source.

  - id: cart_drawer_recommendations
    description: |
      Add three different products to the cart from three different
      collections, open the cart drawer, remove one line item, and
      click a "You may also like" recommendation tile to navigate to
      a new PDP.
    surfaces: [collection, product, cart]
    interactions:
      [open_pdp, add_to_cart, open_cart_drawer, remove_from_cart, follow_recommendation]
    rationale: |
      Cart drawer recommendations vary wildly by app/theme; their
      presence, layout, and product mix are strong fingerprints.

  - id: footer_policy_navigation
    description: |
      From the homepage, scroll to the footer and click each of the
      shipping policy, FAQ, and contact links in turn, returning to
      the homepage between each navigation.
    surfaces: [homepage, footer]
    interactions: [scroll, footer_navigate]
    rationale: |
      Footer link inventory, ordering, and policy-page templates are
      a low-effort but high-signal fingerprint a judge can cite.

  - id: search_no_results_recover
    description: |
      Search for a deliberately mistyped query that returns no or few
      results, follow the storefront's suggested correction or
      recommended-products fallback, and add the resulting product to
      the cart.
    surfaces: [search, product, cart]
    interactions: [search_query, follow_recommendation, open_pdp, add_to_cart]
    rationale: |
      Empty-state UX and "did you mean" recovery flows are
      heavily theme-dependent and surface meaningful synthetic-vs-real
      differences.

  - id: collection_grid_compare_two_pdps
    description: |
      Open a featured collection, open the first product card in a new
      navigation, return to the collection, open the fourth product
      card, then add both products to the cart from their respective
      PDPs.
    surfaces: [collection, product, cart]
    interactions: [open_pdp, variant_select, add_to_cart]
    rationale: |
      Forces two PDP renders within one trace so the judge sees
      per-product layout consistency, gallery behaviour, and
      add-to-cart confirmation in side-by-side context.

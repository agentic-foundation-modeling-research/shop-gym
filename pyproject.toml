[project]
name = "shop-gym"
version = "0.0.0"
description = "ShopGym: sandbox shop websites for building and evaluating shopping LLM agents."
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/shop_guru", "packages/shop_arena", "packages/harness", "packages/shop_probe"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "respx>=0.21",
  "httpx>=0.27",
  "shop-arena",
  "shop-guru",
  "harness",
  "shop-probe",
]

[tool.uv.sources]
shop-arena = { workspace = true }
shop-guru = { workspace = true }
harness = { workspace = true }
shop-probe = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/shop_guru/src", "packages/shop_arena/src", "packages/harness/src", "packages/shop_probe/src"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle + pyflakes
  "I",                 # isort
  "N",                 # pep8-naming
  "UP",                # pyupgrade
  "B",                 # bugbear
  "A",                 # builtins shadow
  "C4",                # comprehensions
  "SIM",               # simplify
  "RET",               # return
  "PL",                # pylint
  "RUF",               # ruff-specific
]
ignore = ["PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["packages/shop_guru/src", "packages/shop_arena/src", "packages/harness/src", "packages/shop_probe/src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["packages/shop_guru/tests", "packages/shop_arena/tests", "packages/harness/tests", "packages/shop_probe/tests"]
addopts = "-ra --strict-markers"
markers = [
  "smoke: live-CLI smoke tests; gated by HARNESS_SMOKE_* env vars",
]
